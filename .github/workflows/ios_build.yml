name: Build iOS App (Flutter IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual button trigger in GitHub Actions tab

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Get Flutter Dependencies
        run: flutter pub get

      - name: 5. Build iOS App (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: 6. Package App into Zip
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../../StaffTracker_iOS.zip Payload

      - name: 7. Upload iOS Build Result
        uses: actions/upload-artifact@v4
        with:
          name: StaffTracker_iOS_Build
          path: StaffTracker_iOS.zip
          jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # ... (checkout code, setup java, setup flutter, etc.)

      - name: Install Apple Certificate and Provisioning Profile
        # You must configure your signing certificates in GitHub Secrets for a valid IPA
        run: |
          # ... (Certificate installation steps)

      - name: Build Flutter iOS IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffTracker_iOS_Build
          # Uploads only the generated .ipa file
          path: build/ios/ipa/*.ipa
