name: staff_tracker
description: "Staff Tracker App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.3
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1
  # Location & Camera
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  # Utilities
  intl: ^0.20.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  package_info_plus: 8.3.1
  launch_at_startup: ^0.2.1
  # Export
  pdf: ^3.12.0
  printing: ^5.13.1
  syncfusion_flutter_xlsio: ^28.1.33
  path_provider: 2.0.15
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
